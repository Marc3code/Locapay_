<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LocaPay - Inquilinos</title>
  <link rel="stylesheet" href="../styles/inquilinos.css" />
  <link rel="stylesheet" href="../components/header_style.css" />
</head>
<body>

  <main class="container">
    <section class="top-actions">
      <h2>Inquilinos</h2>
      <button id="btn-toggle-form" class="btn-primary">+ Novo Inquilino</button>
    </section>

    <section id="form-section" class="form-section hidden">
      <form id="form-inquilino" class="form-card">
        <h3>Cadastrar Novo Inquilino</h3>

        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required />
        </div>

        <div class="form-group">
          <label for="telefone">Telefone:</label>
          <input type="tel" id="telefone" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required />
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>
    </section>

    <section class="tabela-section">
      <h3>Lista de Inquilinos</h3>
      <table id="tabela-inquilinos">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>customer_id</th>
          </tr>
        </thead>
        <tbody>
          <!-- renderizado via JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script type="module" src="../scripts/inquilinos.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
