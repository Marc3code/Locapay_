<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro de Locador</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 360px;
  }
  h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    color: #333;
  }
  label {
    display: block;
    margin-top: 1rem;
    font-weight: bold;
    color: #555;
  }
  input {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.3rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
  }
  button {
    margin-top: 1.8rem;
    width: 100%;
    padding: 0.7rem;
    background-color: #007bff;
    border: none;
    color: white;
    font-size: 1.1rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #0056b3;
  }
  .message {
    margin-top: 1rem;
    text-align: center;
  }
  .error {
    color: #cc0000;
  }
  .success {
    color: #006600;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Cadastro de Locador</h2>
    <form id="form-cadastro-locador">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required minlength="6" />

      <label for="cpf_cnpj">CPF ou CNPJ</label>
      <input type="text" id="cpf_cnpj" name="cpf_cnpj" required pattern="\d{11}|\d{14}" title="Informe 11 dígitos para CPF ou 14 para CNPJ" />

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" name="telefone" required pattern="\d{10,11}" title="Informe somente números, 10 ou 11 dígitos" />

      <button type="submit">Cadastrar</button>
    </form>
    <div id="msg" class="message"></div>
  </div>

  <script>
    const form = document.getElementById('form-cadastro-locador');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'message';

      const nome = form.nome.value.trim();
      const email = form.email.value.trim();
      const senha = form.senha.value;
      const cpf_cnpj = form.cpf_cnpj.value.trim();
      const telefone = form.telefone.value.trim();

      if (!nome || !email || !senha || !cpf_cnpj || !telefone) {
        msg.textContent = 'Preencha todos os campos corretamente.';
        msg.classList.add('error');
        return;
      }

      // Aqui pode validar CPF/CNPJ e telefone mais profundamente se quiser

      try {
        const res = await fetch('https://backend-isolado-production.up.railway.app/locadores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, cpf_cnpj, telefone })
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = 'Locador cadastrado com sucesso!';
          msg.classList.add('success');
          form.reset();
        } else {
          msg.textContent = data.erro || 'Erro ao cadastrar locador.';
          msg.classList.add('error');
        }
      } catch (err) {
        msg.textContent = 'Erro na conexão com o servidor.';
        msg.classList.add('error');
        console.error(err);
      }
    });
  </script>
</body>
</html>
