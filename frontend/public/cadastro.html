<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro | LocaPay</title>
  <link rel="stylesheet" href="./styles/cadastro.css" />
</head>
<body>
  <div class="container">
    <h2>LocaPay</h2>
    <form id="form-cadastro-locador">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: João da Silva" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Ex: joao@email.com" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6" />

      <label for="cpf_cnpj">CPF ou CNPJ</label>
      <input
        type="text"
        id="cpf_cnpj"
        name="cpf_cnpj"
        placeholder="Somente números (11 digitos para CPF ou 14 dígitos para cnpj)"
        required
        pattern="\d{11}|\d{14}"
        title="Informe 11 dígitos para CPF ou 14 para CNPJ"
      />

      <label for="telefone">Telefone</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="Ex: +5584912345678"
        required
        title="Informe seu número nesse formato '+5584912345678'"
      />

      <button type="submit">Cadastrar</button>
    </form>

    <div id="msg" class="message"></div>

    <div class="register-link">
      Já tem uma conta? <a href="login.html">Entrar</a>
    </div>
  </div>

  <script src="./scripts/cadastro.js"></script>
</body>
</html>
